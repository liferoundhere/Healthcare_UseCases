html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
header{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .mark{width:8px;height:26px;border-radius:3px;flex:0 0 8px;background:linear-gradient(#049FD9 0 34%,#1B4F8A 34% 67%,#00897B 67%)}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap;padding-left:16px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hdr-right b{color:var(--ink);font-weight:600}
nav#tabs{flex:0 0 44px;height:44px;display:flex;border-bottom:1px solid var(--line);background:var(--tabbar);padding:0 10px;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
nav#tabs button{font:inherit;flex:1 1 0;min-width:96px;border:0;background:transparent;cursor:pointer;text-align:left;padding:3px 8px 2px;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;color:var(--ink);overflow:hidden}
nav#tabs button:hover{background:var(--hover)}
nav#tabs button.on{background:var(--tabon);border-bottom-color:var(--cisco);box-shadow:inset 0 0 0 1px var(--line)}
nav#tabs .k{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav#tabs .n{display:block;font-size:11.5px;font-weight:600;line-height:1.12;white-space:normal;overflow:hidden;max-height:26px;margin-top:1px}
nav#tabs button.on .k{color:var(--cisco)}
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;min-width:0;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding-top:2px}
#cv{display:block}
#side{flex:0 0 310px;width:310px;border-left:1px solid var(--line);background:var(--panel);padding:12px 14px;overflow-x:hidden;overflow-y:auto;display:none;flex-direction:column;gap:10px}
#app.side-open #side{display:flex}
#side details{border-bottom:1px solid var(--line);padding-bottom:8px}
#side summary{cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:700;padding:2px 0 6px;list-style:none;display:flex;align-items:center;gap:6px}
#side summary::before{content:"\25B8";font-size:11px;transition:transform .15s}
#side details[open]>summary::before{transform:rotate(90deg)}
#side summary::-webkit-details-marker{display:none}
.who{font-size:12px;line-height:1.45;color:var(--ink)}
.who p{margin-top:6px}
.who .pl{display:flex;flex-wrap:wrap;gap:4px}
.who .pl span{border:1px solid var(--line2);border-radius:10px;padding:1px 8px;font-size:11px;color:var(--sub)}
#sideTab{position:absolute;top:50%;right:0;transform:translateY(-50%);z-index:6;writing-mode:vertical-rl;font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;border:1px solid var(--btnline);border-right:0;background:var(--btn);color:var(--ink);border-radius:10px 0 0 10px;padding:14px 7px;cursor:pointer;box-shadow:-3px 0 12px var(--shadow)}
#sideTab:hover{background:var(--hover)}
#app.side-open #sideTab{right:310px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:6px 8px;position:relative;overflow:hidden;transition:box-shadow .2s,border-color .2s}
.kpi.hl{border-color:var(--cisco);box-shadow:0 0 0 2px rgba(4,159,217,.2)}
.kpi .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15;white-space:normal;padding-right:14px}
.kpi .l{font-size:10.5px;color:var(--sub);margin-top:1px;line-height:1.2}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--sub))}
.kpi .tg{position:absolute;right:5px;top:5px}
.feed{display:flex;flex-direction:column;gap:3px;min-height:150px}
.feed .m{font-size:11px;line-height:1.3;padding:4px 6px;border-radius:6px;background:var(--panel2);border-left:3px solid var(--c,#F2A900)}
.feed .m.new{animation:fin .35s ease}
.feed .m b{font-weight:600}
.feed .m .ts{color:var(--faint);font-variant-numeric:tabular-nums;margin-right:4px}
@keyframes fin{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.legend{display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.legend .r{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:4px;flex:0 0 14px}
.sw.dot{border-radius:50%;width:10px;height:10px;flex:0 0 10px;margin:0 2px;box-shadow:0 0 0 3px rgba(242,169,0,.18)}
.tag{display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;height:16px;min-width:16px;padding:0 4px;border-radius:8px;line-height:1;flex:0 0 auto}
.tag.S{background:var(--ink);color:var(--panel)}
.tag.H{background:#049FD9;color:#fff}
.tag.I{background:var(--panel);color:var(--sub);border:1.5px dashed #8a959c;font-style:italic}
.srcnote{font-size:10.5px;color:var(--sub);line-height:1.4;margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.srcnote b{color:var(--ink);font-weight:600}
footer{flex:0 0 46px;height:46px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 16px;background:var(--panel);overflow-x:auto;overflow-y:hidden}
footer button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--btnline);background:var(--btn);color:var(--ink);border-radius:8px;height:30px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
footer button:hover{border-color:var(--faint)}
footer button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
footer [data-tg="mode"] button.on[data-v="story"]{background:#1B4F8A;border-color:#1B4F8A;color:#fff}
footer [data-tg="mode"] button.on[data-v="legacy"]{background:#C62828;border-color:#C62828;color:#fff}
footer [data-tg="mode"] button.on[data-v="tobe"]{background:#049FD9;border-color:#049FD9;color:#fff}
footer [data-tg="aud"] button.on{background:#1B4F8A;border-color:#1B4F8A;color:#fff}
footer .grp{display:flex;gap:0}
footer .grp button{border-radius:0;margin-left:-1px}
footer .grp button:first-child{border-radius:8px 0 0 8px;margin-left:0}
footer .grp button:last-child{border-radius:0 8px 8px 0}
footer .lbl{font-size:11px;color:var(--sub);margin-right:2px;white-space:nowrap}
footer .sp{flex:1}
footer .clock{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
#tip{position:absolute;pointer-events:none;max-width:360px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px var(--shadow);padding:10px 12px;font-size:12px;line-height:1.45;opacity:0;transition:opacity .12s;z-index:5}
#tip.show{opacity:1}
#tip .tt{font-weight:700;font-size:13.5px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
#tip .chips{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
#tip .chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;color:#fff}
#tip .src{color:var(--sub);font-size:10.5px;margin-top:6px}
#caption{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:rgba(29,35,39,.95);color:#fff;border-radius:10px;padding:7px 16px 8px;font-size:14px;width:max-content;max-width:86%;text-align:center;opacity:0;transition:opacity .3s;z-index:4;box-shadow:0 6px 20px rgba(0,0,0,.2)}

#caption .st{display:inline;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#F2A900;font-weight:700;margin-right:10px}
#caption .cx{display:inline}
#caption .bar{height:3px;background:rgba(255,255,255,.18);border-radius:2px;margin-top:6px;overflow:hidden}
#caption .bar i{display:block;height:100%;background:#F2A900;width:0}
@media (max-width:1100px){#side,#sideTab{display:none!important}}

/* ---- 10-engine.js ---- */
/* Scene engine: turns the shared narrative (nodes, links, step states) into an animated floor plan.
   Each use case supplies only placement and decor; state, links, callouts, approvals, clocks, focus and camera are generic. */
let SUF = '', TT = 0;
/* Hotspots are registered in page coordinates: the rectangle is mapped through the current canvas transform,
   so the scene scale and the camera are honoured. */
function HOT(id, x, y, w, h, info) {
  const m = ctx.getTransform(), b = APP.base || 1;
  APP.hot(id + SUF, (m.a * x + m.e) / b, (m.d * y + m.f) / b, (m.a * w) / b, (m.d * h) / b, info);
}
const SCENE_R = [14, 44, 726, 468]; // scene region in scene units: x0, y0, x1, y1
const SCENE_PAD = [24, 30]; // extra room around SCENE_R inside the panel, so the camera push-in never crops content
const CAM_Z = 1.07;
const SCENE_C = [(SCENE_R[0] + SCENE_R[2]) / 2, (SCENE_R[1] + SCENE_R[3]) / 2];

const STATE_NAME = { ok: 'Healthy', warn: 'Warning', down: 'Down', pending: 'Waiting for approval', unknown: 'Unknown', idle: 'Idle', off: 'Off' };
const RANK = { down: 5, warn: 4, pending: 3, unknown: 2, ok: 1, idle: 0, off: 0 };
const sc = (s) => ({ ok: COL.run, warn: COL.warn, down: COL.stop, pending: COL.pending, unknown: COL.unknown, idle: COL.idle, off: COL.idle }[s] || COL.idle);
const worst = (list) => list.reduce((w, s) => ((RANK[s] || 0) > (RANK[w] || 0) ? s : w), 'ok');

/* ---------- state from the narrative ---------- */
const phaseSteps = (c, mode) => c.N.steps.filter((s) => s.phase === (mode === 'tobe' ? 'cisco' : 'today'));
const stateMemo = new Map();
function computeState(c, mode, i) {
  const key = `${c.id}|${mode}|${i}`;
  if (stateMemo.has(key)) return stateMemo.get(key);
  const N = c.N, steps = phaseSteps(c, mode);
  const vis = new Map(), ns = new Map(), ls = new Map(), labels = new Map();
  N.nodes.forEach((n) => { vis.set(n.id, !n.hidden); ns.set(n.id, 'ok'); });
  N.zones.forEach((z) => vis.set(z.id, !z.hidden));
  N.links.forEach((l) => ls.set(l.id, 'idle'));
  const today = N.steps.filter((s) => s.phase === 'today');
  if (mode === 'tobe') {
    // The With Cloud Control story replays the same event: whatever the first story revealed is already on the map.
    today.forEach((s) => { (s.show || []).forEach((id) => vis.set(id, true)); (s.hide || []).forEach((id) => vis.set(id, false)); });
    Object.entries(today[0].l || {}).forEach(([k, v]) => ls.set(k, v));
  }
  let callout = null, modal = null, clock = null, from = 0;
  for (let s = 0; s <= i && s < steps.length; s++) {
    const st = steps[s];
    Object.entries(st.n || {}).forEach(([k, v]) => ns.set(k, v));
    Object.entries(st.l || {}).forEach(([k, v]) => ls.set(k, v));
    Object.entries(st.label || {}).forEach(([k, v]) => labels.set(k, v));
    (st.show || []).forEach((id) => vis.set(id, true));
    (st.hide || []).forEach((id) => vis.set(id, false));
    if (st.clock) { clock = st.clock; from = s; }
  }
  const cur = steps[Math.min(i, steps.length - 1)];
  callout = cur.callout || null; modal = cur.modal || null;
  const out = { vis, ns, ls, labels, callout, modal, clock, clockFrom: from, step: cur };
  stateMemo.set(key, out);
  return out;
}

function ciscoNodes(c) {
  if (c._cn) return c._cn;
  const set = new Set();
  c.N.steps.filter((s) => s.phase === 'cisco').forEach((s) => (s.show || []).forEach((id) => set.add(id)));
  c.N.nodes.forEach((n) => { if (n.hidden && !c.N.steps.some((s) => s.phase === 'today' && (s.show || []).includes(n.id))) set.add(n.id); });
  c._cn = set;
  return set;
}
function ownerOf(c, n) {
  if (c.owners && c.owners[n.id]) return c.owners[n.id];
  if (ciscoNodes(c).has(n.id)) return 'cisco';
  if (n.icon === 'cloud' || n.icon === 'ambulance') return 'partner';
  if (n.icon === 'person' || n.icon === 'people' || n.icon === 'badge') return 'people';
  return 'hosp';
}

/* ---------- animation memory (colours, fades, focus and camera ease between steps) ---------- */
const ANIM = { key: '', nodes: new Map(), zones: new Map(), cam: null };
function animFor(map, id, ta, color, snap) {
  let a = map.get(id);
  if (!a) { a = { a: snap ? ta : 0, col: color, rv: 0, bump: 0, state: '', dim: 1, pk: 0 }; map.set(id, a); }
  return a;
}

/* ---------- scene context handed to each use case ---------- */
function makeScene(c, mode, u, t, app) {
  TT = t;
  const steps = phaseSteps(c, mode), n = steps.length;
  const i = Math.min(n - 1, Math.floor(u * n)), su = clamp(u * n - i, 0, 1);
  const cur = computeState(c, mode, i), prev = i > 0 ? computeState(c, mode, i - 1) : null;
  const key = `${c.id}|${mode}`;
  const snap = ANIM.key !== key;
  if (snap) { ANIM.key = key; ANIM.nodes.clear(); ANIM.zones.clear(); ANIM.cam = null; }
  const dt = app.dt || 0, k = snap ? 1 : 1 - Math.exp(-Math.min(dt, 0.1) * 6), k2 = snap ? 1 : 1 - Math.exp(-Math.min(dt, 0.1) * 4.5);
  const S = { c, mode, W: mode === 'tobe', i, n, su, u, t, dt, cur, prev, step: steps[i], steps, app, N: c.N, lang: app.aud };
  S.pos = c.scene.pos;
  S.st = (id) => cur.ns.get(id) || 'ok';
  S.visT = (id) => (cur.vis.get(id) ? 1 : 0);
  S.alpha = (id) => { const a = ANIM.nodes.get(id) || ANIM.zones.get(id); return a ? a.a : S.visT(id); };
  S.changed = (id) => !prev || prev.ns.get(id) !== cur.ns.get(id) || (cur.labels.get(id) || '') !== (prev.labels.get(id) || '') || prev.vis.get(id) !== cur.vis.get(id);

  /* primary element: the thing this step is about. It grows, everything else steps back. */
  const co = cur.callout;
  let prim = co && S.pos[co.node] && cur.vis.get(co.node) ? co.node : null;
  if (!prim) {
    let best = -1;
    c.N.nodes.forEach((nd) => {
      if (!cur.vis.get(nd.id) || !S.pos[nd.id] || (prev && !S.changed(nd.id))) return;
      const r = RANK[S.st(nd.id)] || 0; if (r > best) { best = r; prim = nd.id; }
    });
  }
  const focus = new Set();
  if (prim) {
    focus.add(prim);
    if (prev) c.N.nodes.forEach((nd) => { if (cur.vis.get(nd.id) && S.changed(nd.id)) focus.add(nd.id); });
    c.N.links.forEach((l) => { const st = cur.ls.get(l.id); if ((l.a === prim || l.b === prim) && st && st !== 'idle' && st !== 'off') { focus.add(l.a); focus.add(l.b); } });
  }
  S.prim = prim; S.focus = focus;

  c.N.nodes.forEach((nd) => {
    const a = animFor(ANIM.nodes, nd.id, S.visT(nd.id), sc(S.st(nd.id)), snap);
    const col = sc(S.st(nd.id));
    if (a.state && a.state !== S.st(nd.id) && a.a > 0.5) a.rv = 1;
    if (!snap && S.visT(nd.id) && a.a < 0.1) a.bump = 1;
    a.state = S.st(nd.id); a.a += (S.visT(nd.id) - a.a) * k; a.col = snap ? col : mix(a.col, col, k);
    a.rv = Math.max(0, a.rv - dt * 0.9); a.bump = Math.max(0, a.bump - dt * 1.4);
    a.dim += (((!prim || focus.has(nd.id)) ? 1 : 0.46) - a.dim) * k2;
    a.pk += ((nd.id === prim ? 1 : 0) - a.pk) * k2;
  });
  c.N.zones.forEach((z) => { const a = animFor(ANIM.zones, z.id, S.visT(z.id), COL.idle, snap); a.a += (S.visT(z.id) - a.a) * k; });

  /* camera: a gentle push-in toward the primary element (clamped so the scene always fills its panel) */
  const cam = ANIM.cam || (ANIM.cam = { z: 1, px: 0, py: 0, vk: 0, fx: SCENE_C[0], fy: SCENE_C[1] });
  const pp = prim && S.pos[prim], tz = pp ? CAM_Z : 1, kc = snap ? 1 : 1 - Math.exp(-Math.min(dt, 0.1) * 2.2);
  /* the visible window is SCENE_R plus SCENE_PAD, sized so a centered CAM_Z push-in never crops content; no pan */
  const tpx = 0, tpy = 0;
  cam.z += (tz - cam.z) * kc; cam.px += (tpx - cam.px) * kc; cam.py += (tpy - cam.py) * kc; cam.vk += ((pp ? 1 : 0) - cam.vk) * kc;
  if (pp) { cam.fx += (pp[0] - cam.fx) * Math.min(1, kc * 1.6); cam.fy += (pp[1] - cam.fy) * Math.min(1, kc * 1.6); }

  /* zone: a named area. Floor tint follows the worst state among watched devices. */
  S.zone = (id, x, y, w, h, o = {}) => {
    const z = c.N.zones.find((q) => q.id === id), a = ANIM.zones.get(id) ? ANIM.zones.get(id).a : 1;
    if (a < 0.02) return;
    ctx.save(); ctx.globalAlpha *= a;
    S.area(x, y, w, h, o.label || (z && z.label), Object.assign({}, o, { id }));
    ctx.restore();
  };
  /* state shading: red hatch when something inside is down, amber when warning, blue dashes while waiting for approval */
  S.shade = (x, y, w, h, watch, r = 10) => {
    const ws = watch && watch.length ? worst(watch.map((q) => S.st(q))) : 'ok';
    const pulse = 0.5 + 0.5 * Math.sin(t * 5);
    if (ws === 'down') {
      ctx.save(); D.rr(x, y, w, h, r); ctx.clip();
      ctx.fillStyle = tint(COL.pain, 0.06 + 0.03 * pulse); ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = tint(COL.pain, 0.14); ctx.lineWidth = 5;
      for (let q = -h; q < w; q += 16) { ctx.beginPath(); ctx.moveTo(x + q, y); ctx.lineTo(x + q + h, y + h); ctx.stroke(); }
      ctx.restore();
      D.box(x, y, w, h, { stroke: COL.pain, lw: 1.8, r, dash: [6, 4] });
    } else if (ws === 'warn') {
      D.box(x, y, w, h, { fill: tint(COL.warn, 0.08), stroke: tint(COL.warn, 0.9), lw: 1.8, r, dash: [6, 4] });
    } else if (ws === 'pending') {
      D.box(x, y, w, h, { fill: tint(COL.cisco, 0.05), stroke: tint(COL.cisco, 0.7), lw: 1.6, r, dash: [3, 4] });
    }
  };
  S.area = (x, y, w, h, label, o = {}) => {
    D.box(x, y, w, h, { fill: o.fill || T.floor, stroke: o.stroke || T.wall, lw: o.lw || 1.8, r: o.r ?? 10, shadow: o.shadow ?? 0, dash: o.dash });
    if (!o.late) S.shade(x, y, w, h, o.watch, o.r ?? 10);

      const col = o.cisco ? COL.cisco : o.lc || T.sub;

  };

  return S;
}

/* ---------- floor furniture (simple items; richer set dressing lives in 12-kit.js) ---------- */

/* ---------- devices ---------- */
function deviceInfo(S, n) {
  const own = ownerOf(S.c, n), st = S.st(n.id);
  const sub = n.sub;
  const body = `${sub[S.lang]}. ${STATE_NAME[st] ? 'State in this step: ' + STATE_NAME[st].toLowerCase() + '.' : ''}<br><i>Executive: ${sub.exec}. IT director: ${sub.dir}. Engineering: ${sub.eng}.</i>`;
  return { owner: own, tag: own === 'cisco' ? 'S' : 'I', title: n.title, body, src: `Storyboard ${S.c.id}; placement is illustrative`, state: st };
}

function drawNode(S, n) {
  const p = S.pos[n.id]; if (!p) return;
  const an = ANIM.nodes.get(n.id); if (!an || an.a < 0.02) return;
  const [x, y, o = {}] = p, t = S.t, state = S.st(n.id), col = an.col, cisco = ciscoNodes(S.c).has(n.id);
  const pk = smooth(an.pk), dim = an.dim;
  const sz = (n.r || 30) / 30, a = smooth(an.a), grow = (0.78 + 0.22 * a) * (1 + 0.22 * Math.sin(an.bump * Math.PI)) * (o.s || 1) * (1 + 0.45 * pk);
  const R = 18 * sz, Rl = R * (1 + 0.45 * pk);
  ctx.save(); ctx.globalAlpha *= a * dim; ctx.translate(x, y); ctx.scale(grow, grow); ctx.translate(-x, -y);
  const pulse = 0.5 + 0.5 * Math.sin(t * (state === 'down' ? 6.5 : 3.5));
  if (pk > 0.02) {
    const fc = state === 'ok' ? (cisco ? COL.cisco : COL.run) : col;
    D.circle(x, y, R + 26 + pulse * 4, { fill: tint(fc, 0.10 * pk) });
    D.circle(x, y, R + 15 + pulse * 3, { fill: tint(fc, 0.13 * pk) });
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.8); D.circle(0, 0, R + 11, { stroke: tint(fc, 0.85 * pk), lw: 2.2, dash: [9, 7] }); ctx.restore();
  }
  if (state === 'warn' || state === 'down') {
    D.circle(x, y, R + 5 + pulse * 5, { fill: tint(col, 0.1 + 0.08 * pulse) });
    D.circle(x, y, R + 3 + pulse * 3, { stroke: tint(col, 0.55 * (0.5 + pulse * 0.5)), lw: 1.5 });
  }
  if (an.rv > 0) D.circle(x, y, R + (1 - an.rv) * 38, { stroke: tint(col, an.rv * 0.8), lw: 2.4 });
  if (cisco) D.box(x - R - 3, y - R + 1, (R + 3) * 2, (R - 1) * 2, { fill: T.panel, stroke: state === 'ok' ? COL.cisco : col, lw: 2.6, r: 9, shadow: 8 });
  else D.circle(x, y, R, { fill: state === 'down' ? tint(col, 0.14) : T.panel, stroke: col, lw: state === 'idle' || state === 'off' ? 1.8 : 3, shadow: 8, dash: state === 'unknown' ? [3, 3] : null });
  if (state === 'pending') { ctx.save(); ctx.translate(x, y); ctx.rotate(t * 1.4); D.circle(0, 0, R + 4, { stroke: COL.pending, lw: 2.2, dash: [5, 6] }); ctx.restore(); }
  const ic = state === 'ok' ? (cisco ? COL.cisco : T.ink) : state === 'idle' || state === 'off' ? COL.idle : state === 'pending' ? COL.cisco : col === COL.warn ? COL.amber : col;
  D.icon(n.icon, x, y, 20 * sz, ic);
  if (state === 'down') { D.circle(x + R * 0.8, y - R * 0.8, 7, { fill: COL.stop, stroke: T.panel, lw: 1.2 }); D.icon('cross', x + R * 0.8, y - R * 0.8, 8, '#fff'); }
  ctx.restore();

  // label and caption (labels do not scale with the node, so they stay crisp)
  const side = o.lab || 'b';
  const cap = S.cur.labels.get(n.id) || (S.changed(n.id) && S.i > 0 ? n.sub[S.lang] : '') || (S.i === 0 && S.cur.step.callout && S.cur.step.callout.node === n.id ? n.sub[S.lang] : '') || (pk > 0.5 ? n.sub[S.lang] : '');
  ctx.save(); ctx.globalAlpha *= a * (0.55 + 0.45 * dim);
  const ts = 11.5 + 2.2 * pk, cs = 10.2 + 0.8 * pk;
  const ty = side === 't' ? y - Rl - 12 : y + Rl + 13;
  const align = side === 'r' ? 'left' : side === 'l' ? 'right' : 'center';
  let tx = side === 'r' ? x + Rl + 9 : side === 'l' ? x - Rl - 9 : x;
  if (align === 'center') { // keep centered labels inside the scene window
    const hw = Math.max(Math.min(190, D.measure(n.title, ts, 800)), cap ? D.measure(cap, cs, 600) + 14 : 0) / 2 + 3;
    tx = clamp(tx, SCENE_R[0] + hw, SCENE_R[2] - hw);
  }
  const ly = side === 'r' || side === 'l' ? y - 5 : ty;
  D.text(n.title, tx, ly, { size: ts, weight: 800, color: T.ink, align, halo: 4, maxW: 190 });
  if (cap) {
    const w = D.measure(cap, cs, 600) + 14, cy = side === 'r' || side === 'l' ? y + 12 : side === 't' ? ty - 16 : ty + 17;
    const bx = align === 'center' ? tx - w / 2 : align === 'left' ? tx : tx - w;
    D.box(bx, cy - 9, w, 18, { fill: T.panel, stroke: tint(col, 0.9), lw: 1.4, r: 9 });
    D.text(cap, bx + 7, cy + 0.5, { size: cs, weight: 600, color: T.ink, maxW: 230 });
  }
  ctx.restore();
  HOT('n_' + n.id, x - Rl - 4, y - Rl - 4, (Rl + 4) * 2, (Rl + 4) * 2 + 22, deviceInfo(S, n));
}

/* ---------- links ---------- */
function drawLinks(S) {
  const t = S.t;
  S.N.links.forEach((l) => {
    const pa = S.pos[l.a], pb = S.pos[l.b]; if (!pa || !pb) return;
    const A = ANIM.nodes.get(l.a), B = ANIM.nodes.get(l.b); if (!A || !B) return;
    const va = Math.min(A.a, B.a); if (va < 0.05) return;
    const state = S.cur.ls.get(l.id) || 'idle'; if (state === 'off') return;
    const hot = S.prim && (l.a === S.prim || l.b === S.prim);
    const a = [pa[0], pa[1]], b = [pb[0], pb[1]];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    const off = 24, sa = [a[0] + (dx / len) * off, a[1] + (dy / len) * off], sb = [b[0] - (dx / len) * off, b[1] - (dy / len) * off];
    const path = curve(sa, sb, l.bend || 0), col = sc(state);
    ctx.save(); ctx.globalAlpha *= va * Math.max(A.dim, B.dim);
    if (state === 'idle' || state === 'unknown') {
      D.line(path.pts, { lw: 1.6, color: tint(state === 'unknown' ? COL.unknown : COL.idle, 0.6), dash: [3, 4] });
    } else if (state === 'down') {
      D.line(path.pts, { lw: 2.4, color: tint(COL.stop, 0.5), dash: [4, 4] });
      const half = Path(path.pts.slice(0, Math.ceil(path.pts.length * 0.48)));
      if (half.L > 4) D.flow(half, t, { color: COL.stop, n: 1, speed: 50, r: 3.2 });
      const m = path.atU(0.5); D.circle(m.x, m.y, 9, { fill: T.panel, stroke: COL.stop, lw: 1.5 }); D.icon('cross', m.x, m.y, 10, COL.stop);
    } else {
      if (hot) D.line(path.pts, { lw: 7, color: tint(col, 0.14) });
      const speed = state === 'warn' ? 30 : state === 'pending' ? 40 : 75;
      D.flow(path, t + l.a.length * 0.17, { color: col, n: Math.max(1, Math.round(path.L / 100)), speed, r: hot ? 4 : 3.3, lw: hot ? 2.6 : 2 });
    }
    ctx.restore();
  });
}

/* ---------- spotlight veil: softens the floor plan everywhere except around the primary element ---------- */
function drawVeil(S) {
  const cam = ANIM.cam; if (!cam || cam.vk < 0.02 || !S.prim) return;
  const g = ctx.createRadialGradient(cam.fx, cam.fy, 50, cam.fx, cam.fy, 250);
  g.addColorStop(0, tint(T.panel, 0)); g.addColorStop(0.45, tint(T.panel, 0.05 * cam.vk)); g.addColorStop(1, tint(T.panel, 0.34 * cam.vk));
  ctx.fillStyle = g; ctx.fillRect(SCENE_R[0] - 120, SCENE_R[1] - 80, SCENE_R[2] - SCENE_R[0] + 240, SCENE_R[3] - SCENE_R[1] + 160);
}

/* ---------- overlays: callout bubble, approval card, clock ---------- */
function drawCallout(S) {

  const p = S.pos[co.node], an = ANIM.nodes.get(co.node); if (!p || !an || an.a < 0.5) return;

  const size = 12, maxW = 290, w = Math.min(maxW, D.measure(co.text, size, 600) + 22);
  const n = D.lines(co.text, w - 22, size, 600), lh = size + 4, h = n * lh + 14;
  const col = sc(S.st(co.node)), cb = (p[2] && p[2].cb) || [0, 0];
  let bx = clamp(p[0] - w / 2 + cb[0], 20, 722 - w), by = p[1] - 62 - h + cb[1];
  if (by < 50) by = p[1] + 66;
  ctx.save(); ctx.globalAlpha *= k; ctx.translate(0, (1 - k) * 6);
  D.line([[clamp(p[0], bx + 14, bx + w - 14), by + (by > p[1] ? 0 : h)], [p[0], p[1] + (by > p[1] ? 26 : -26)]], { lw: 1.8, color: col });
  D.box(bx, by, w, h, { fill: T.panel, stroke: col === COL.warn ? COL.amber : col, lw: 2, r: 9, shadow: 8 });
  D.wrap(co.text, bx + 11, by + 8 + lh / 2, w - 22, lh, { size, weight: 600, color: T.ink });

}

function drawModal(S) {
  const m = S.cur.modal; if (!m) return;
  const k = smooth(ph(S.su, 0.04, 0.22)); if (k <= 0) return;
  const pos = S.c.scene.modalPos || [330, 210], w = S.c.scene.modalW || 326, lh = 14.5, fs = 11.5;
  let h = 54; const lines = m.lines.map((l) => D.split(l, w - 36, fs, 500)); lines.forEach((ls) => { h += ls.length * lh + 3; }); h += 36;
  const x = pos[0], y = pos[1], done = S.su > 0.58;

  D.box(x, y, w, h, { fill: T.panel, stroke: COL.cisco, lw: 2.2, r: 10, shadow: 16 });
  D.box(x, y, w, 28, { fill: tint(COL.cisco, 0.12), r: 10 }); D.box(x, y + 22, w, 8, { fill: tint(COL.cisco, 0.12), r: 0 });

  if (!done) { const q = mod(S.t * 1.2, 1); D.box(x + 14 - q * 6, by - 12 - q * 6, 124 + q * 12, 28 + q * 12, { stroke: tint(COL.cisco, 0.5 * (1 - q)), lw: 1.4, r: 18 }); }
  ctx.restore();
  HOT('modal', x, y, w, h, { owner: 'cisco', tag: 'S', title: m.title, body: m.lines.join('<br>') + '<br><i>The approval is simulated here. In the product a named person approves before anything executes.</i>', src: `Storyboard ${S.c.id}` });
}

function drawClock(S) {
  const ck = S.cur.clock; if (!ck || ck.mode === 'hide') return;

  const sec = Math.floor(base) % 3600, txt = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;

  D.text(ck.label, x + 29, y + 13, { size: 11, weight: 700, color: T.ink });

/* Cloud Control band: the floating Cisco plane, drawn along the bottom of the scene when 'cc' is shown. */
const CC_BAND = [20, 372, 700, 90];
function drawCCBand(S) {

  ctx.save(); ctx.globalAlpha *= a.a;
  D.box(x, y, w, h, { fill: tint(COL.cisco, 0.08), stroke: COL.cisco, lw: 1.9, r: 12, dash: [8, 5] });
  // a soft sheen sweeping across the control plane

  const sx = x + mod(S.t * 70, w + 160) - 80, g = ctx.createLinearGradient(sx - 60, 0, sx + 60, 0);
  g.addColorStop(0, tint(COL.cisco, 0)); g.addColorStop(0.5, tint(COL.cisco, 0.1)); g.addColorStop(1, tint(COL.cisco, 0));
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();

}

/* Legacy counterpart of the Cloud Control band: the separate tools that never share a view. */
function drawLegacyBand(S) {
  const [x, y, w, h] = CC_BAND, L = S.c.legacy.silos;

  });

}

/* One call draws a whole use case scene (decor, links, devices, overlays). */
function drawUCScene(c, mode, u, t, app) {
  const S = makeScene(c, mode, u, t, app), cam = ANIM.cam;
  ctx.save();
  ctx.translate(SCENE_C[0] + cam.px, SCENE_C[1] + cam.py); ctx.scale(cam.z, cam.z); ctx.translate(-SCENE_C[0], -SCENE_C[1]);
  c.scene.decor(S);
  if (mode === 'legacy' && !c.scene.noLegacyBand) drawLegacyBand(S);
  drawCCBand(S);
  drawVeil(S);
  drawLinks(S);
  c.scene.extra && c.scene.extra(S, 'under');
  S.N.nodes.filter((n) => n.id !== S.prim).forEach((n) => drawNode(S, n));
  const pn = S.N.nodes.find((n) => n.id === S.prim); if (pn) drawNode(S, pn);
  c.scene.extra && c.scene.extra(S, 'over');
  drawCallout(S);
  ctx.restore();
  drawClock(S); drawModal(S);
  return S;
}

/* ---- 12-kit.js ---- */
/* Set dressing: rooms, beds, racks, clouds, fibre, towers, buildings and people. Pure drawing, theme aware, animated by TT. */
const KP = () => (THEME === 'dark'
  ? { vinyl: '#10294a', wood: '#1c2c3d', carpet: '#13284a', raised: '#0e2342', glass: '#1f5577', steel: '#456586', screen: '#050f1c', metal: '#294666', sheet: '#d9e6f2', blanket: '#2a8f93', roof: '#17304f', grass: '#12302a', asphalt: '#0b1626', gown: '#8fb4d6', cloud: '#12304f' }
  : { vinyl: '#eef3f6', wood: '#f2e9d9', carpet: '#e7ebf1', raised: '#e3e9ee', glass: '#cdeaf8', steel: '#c4ced6', screen: '#16212b', metal: '#d3dae0', sheet: '#ffffff', blanket: '#8fd0c8', roof: '#e6eaee', grass: '#e8f2df', asphalt: '#e6eaed', gown: '#b9d6ef', cloud: '#ffffff' });

function walker(S, pts, o = {}) {
  const p = Path(pts.concat(o.loop === false ? [] : [pts[0]])), dist = mod(S.t * (o.speed || 24) + (o.off || 0) * p.L, p.L), q = p.at(dist);
  D.person(q.x, q.y, q.a, o.color || COL.hosp, { kind: o.kind || 'nurse', swing: Math.sin(dist * 0.42), label: o.label, ly: o.ly, dev: o.dev, s: o.s });
}

const K = {
  grid(x, y, w, h, step, color, lw = 0.7) {
    ctx.save(); ctx.beginPath();
    for (let gx = x + step; gx < x + w - 1; gx += step) { ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); }
    for (let gy = y + step; gy < y + h - 1; gy += step) { ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); }
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(); ctx.restore();
  },
  stripes(x, y, w, h, step, color, lw = 0.8) {
    ctx.save(); ctx.beginPath(); for (let gy = y + step; gy < y + h - 1; gy += step) { ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); }
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(); ctx.restore();
  },
  floor(x, y, w, h, kind = 'vinyl', r = 6) {
    const p = KP(); D.box(x, y, w, h, { fill: p[kind] || p.vinyl, r });
    ctx.save(); D.rr(x, y, w, h, r); ctx.clip();
    if (kind === 'wood') K.stripes(x, y, w, h, 7, tint('#a07a4a', THEME === 'dark' ? 0.25 : 0.2));
    else if (kind === 'carpet') K.grid(x, y, w, h, 6, tint(T.wall, 0.12), 0.5);
    else K.grid(x, y, w, h, 14, tint(T.wall, 0.2), 0.6);
    ctx.restore();
  },
  window(x, y, w) { const p = KP(); D.box(x, y - 2, w, 4, { fill: p.glass, stroke: T.wall, lw: 0.8, r: 1 }); D.line([[x + w / 2, y - 2], [x + w / 2, y + 2]], { lw: 0.8, color: T.wall }); },

  curtain(x, y, w) {
    ctx.save(); ctx.beginPath(); ctx.moveTo(x, y); for (let k = 0; k <= w; k += 3) ctx.lineTo(x + k, y + Math.sin(k * 0.7) * 1.6); ctx.strokeStyle = tint(COL.people, 0.7); ctx.lineWidth = 2.4; ctx.stroke(); ctx.restore();
  },
  corkboard(x, y, w, h, pins = []) {
    D.box(x, y, w, h, { fill: THEME === 'dark' ? '#3a3524' : '#d9b97c', stroke: T.wall, lw: 2, r: 3, shadow: 3 });
    [[6, 8, 16, 12], [30, 14, 18, 14], [14, 36, 17, 12], [42, 40, 16, 13], [24, 62, 18, 12]].forEach((q) => { if (q[0] + q[2] < w - 3 && q[1] + q[3] < h - 3) D.box(x + q[0], y + q[1], q[2], q[3], { fill: '#fffdf4', stroke: 'rgba(0,0,0,.15)', lw: 0.6, r: 1 }); });
    if (pins.length > 1) { ctx.save(); ctx.beginPath(); pins.forEach((q, i) => { if (i) ctx.lineTo(x + q[0], y + q[1]); else ctx.moveTo(x + q[0], y + q[1]); }); ctx.strokeStyle = tint(COL.pain, 0.65); ctx.lineWidth = 1; ctx.stroke(); ctx.restore(); }
    pins.forEach((q) => D.circle(x + q[0], y + q[1], 2.6, { fill: COL.pain, stroke: 'rgba(0,0,0,.25)', lw: 0.6 }));
  },
  tree(x, y, r = 8) {
    const f = tint('#4c9a5a', THEME === 'dark' ? 0.26 : 0.38), s = tint('#3f8a50', 0.7);
    D.circle(x + 1.5, y + 2, r * 1.05, { fill: 'rgba(0,0,0,.1)' });
    [[-0.5, 0.3, 0.78], [0.55, 0.25, 0.72], [0, -0.45, 0.88]].forEach((q) => D.circle(x + q[0] * r, y + q[1] * r, r * q[2], { fill: f, stroke: s, lw: 0.9 }));
    D.circle(x - r * 0.15, y - r * 0.2, r * 0.3, { fill: tint('#6fbf7c', 0.35) });
  },
  road(x, y, w, h) {
    const p = KP(); D.box(x, y, w, h, { fill: p.asphalt, stroke: tint(T.wall, 0.5), lw: 1, r: 3 });
    const horiz = w > h; ctx.save(); ctx.beginPath();
    for (let k = 0; k < (horiz ? w : h) / 22 - 1; k++) { if (horiz) { ctx.moveTo(x + 10 + k * 22, y + h / 2); ctx.lineTo(x + 20 + k * 22, y + h / 2); } else { ctx.moveTo(x + w / 2, y + 10 + k * 22); ctx.lineTo(x + w / 2, y + 20 + k * 22); } }
    ctx.strokeStyle = tint(T.wall, 0.8); ctx.lineWidth = 1.4; ctx.stroke(); ctx.restore();
  },
  car(x, y, ang, o = {}) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    D.box(-15, -7.5, 30, 15, { fill: o.body || '#fff', stroke: o.color || COL.pain, lw: 1.5, r: 5, shadow: 3 });
    D.box(3, -5.5, 9, 11, { fill: tint(o.color || COL.pain, 0.25), r: 2 }); D.line([[-8, -4], [-8, 4]], { lw: 2.4, color: o.color || COL.pain, cap: 'butt' }); D.line([[-11, 0], [-5, 0]], { lw: 2.4, color: o.color || COL.pain, cap: 'butt' });
    if (o.lights) { const b = Math.sin((o.t || TT) * 12) > 0; D.circle(0, -9, 2.6, { fill: b ? COL.pain : COL.cisco }); D.circle(0, 9, 2.6, { fill: b ? COL.cisco : COL.pain }); }
    ctx.restore();
  },
  /* Patient room: vinyl floor, window, bed with patient, headwall monitor, IV pole, bedside table, chair and a door. */
  ward(x, y, w, h, label, o = {}) {
    K.floor(x, y, w, h, o.floor || 'vinyl', 6); D.box(x, y, w, h, { stroke: T.wall, lw: 1.8, r: 6 });
    K.window(x + w * 0.2, y, w * 0.6);
    if (label) D.text(label.toUpperCase(), x + 8, y + 14, { size: 9.5, weight: 800, color: T.sub, maxW: w - 14 });
    if (o.bed !== false) {
      const bx = o.bx ?? x + w * 0.42, by = o.by ?? y + h * 0.6;
      K.ecg(bx - 9, by - 33, 18, 8); K.bed(bx, by, { patient: o.occ !== false, blanket: o.blanket });
      K.ivPole(bx + 19, by - 4); D.box(bx - 26, by - 13, 9, 11, { fill: T.panel, stroke: T.wall, lw: 0.9, r: 2 });
    }
    K.chair(x + w - 14, y + h - 16, -0.6, tint(COL.people, 0.45));
    K.doorArc(x + w - 38, y + h, 13, 1);
  },
  corridor(x, y, w, h, label) {
    const p = KP(); K.floor(x, y, w, h, 'vinyl', 6); D.box(x, y, w, h, { stroke: T.wall, lw: 1.8, r: 6 });
    D.line([[x + 6, y + 5], [x + w - 6, y + 5]], { lw: 2, color: p.steel }); D.line([[x + 6, y + h - 5], [x + w - 6, y + h - 5]], { lw: 2, color: p.steel });
    for (let xx = x + 40; xx < x + w - 24; xx += 58) D.box(xx, y + h / 2 - 3, 20, 6, { fill: THEME === 'dark' ? 'rgba(255,240,170,.16)' : 'rgba(255,224,120,.55)', r: 3 });
    D.line([[x + 12, y + h / 2], [x + w - 12, y + h / 2]], { lw: 1, color: tint(COL.people, 0.35), dash: [8, 8] });

  },
  nurseStation(x, y, w, h, o = {}) {
    const p = KP();
    D.box(x, y, w, h, { fill: T.panel, stroke: T.wall, lw: 2.2, r: 12, shadow: 3 }); D.box(x + 6, y + 6, w - 12, h - 12, { fill: p.vinyl, stroke: tint(T.wall, 0.5), lw: 0.8, r: 8 });
    for (let k = 0; k < Math.max(2, Math.floor(w / 36)); k++) { const px = x + 14 + k * 30; D.box(px, y + 9, 12, 8, { fill: p.screen, stroke: T.wall, lw: 0.7, r: 1.5 }); D.box(px + 1, y + 10, 10, 6, { fill: tint(COL.cisco, 0.5 + 0.2 * Math.sin(TT * 2 + k)), r: 1 }); }
    D.person(x + w * 0.3, y + h * 0.62, -Math.PI / 2, null, { kind: 'nurse', seat: true, s: 0.85 });
    D.person(x + w * 0.62, y + h * 0.62, -Math.PI / 2, null, { kind: 'doc', seat: true, s: 0.85 });
    if (o.label) D.text(o.label, x + w / 2, y + h + 9, { size: 9, weight: 700, color: T.sub, align: 'center', halo: 3 });
  },
  /* The carrier path between sites: a switch stack, two fibre trunks in duct with manholes, and a radio tower. */
  networkPath(x, y, w, h) {
    const cx = x + w / 2; K.switchStack(cx - 45, y + 28, 3, 90);
    const f1 = x + w * 0.32, f2 = x + w * 0.68;
    K.conduit([[f1, y + 66], [f1, y + h - 70]], { speed: 30 }); K.conduit([[f2, y + 66], [f2, y + h - 70]], { speed: -30 });
    K.manhole(f1, y + h * 0.42); K.manhole(f2, y + h * 0.62); K.manhole(f1, y + h * 0.82 - 20);
    K.switchStack(cx - 45, y + h - 64, 2, 90); K.tower(x + w - 24, y + h - 20, 0.8);
  },
  /* A thin lane of road with a manhole: cloud connectivity leaving a building. */
  uplink(pts, o = {}) { K.fiber(pts, o); },
};

/* ---- 20-page.js ---- */
/* Page layout. The story is the workflow: a step rail across the top drives everything.
   Below it, a large floor plan (scaled to the space available) sits beside a column that narrates the current step. */
const SD = 5.5;                       // seconds per story step at 1x
const UCS = [];
const SRCNAME = 'Healthcare infrastructure storyboard';
const AUDNAME = { exec: 'Executive', dir: 'IT director', eng: 'Engineering' };
const modeColor = (m) => (m === 'tobe' ? COL.cisco : COL.pain);
const MODENAME = { legacy: 'TODAY | ANY INFRASTRUCTURE', tobe: 'WITH CISCO CLOUD CONTROL | MODELED' };
const M = 18;

function fitText(s, x, y, maxW, size, o = {}) {
  let sz = size; while (sz > 9.5 && D.measure(s, sz, o.weight || 500) > maxW) sz -= 0.5;
  D.text(s, x, y, Object.assign({}, o, { size: sz, maxW }));
}
const allSteps = (c) => phaseSteps(c, 'legacy').map((s) => ({ s, mode: 'legacy' })).concat(phaseSteps(c, 'tobe').map((s) => ({ s, mode: 'tobe' })));

function factsOf(c, mode) {
  if (mode === 'tobe') return [['Cisco Cloud Control is generally available in the US only (from 25 Aug 2026) [S]', 'S']].concat(c.chips.map((q) => [`${q[0]}: ${q[1]}`, 'S']));
  const out = [];
  c.N.steps.filter((s) => s.phase === 'today').forEach((s) => (s.facts || []).forEach((f) => out.push([`${f.v} ${f.l} [${f.s}]`, /gap/i.test(f.s) ? 'H' : 'S'])));
  return out;
}

/* All regions in one place; the logical canvas is 900 tall and as wide as the window allows. */
function layout(app) {
  const VW = app.W, mainY = 168, mainH = 680, headH = 38, areaH = mainH - headH - 8;
  const rw0 = SCENE_R[2] - SCENE_R[0] + 2 * SCENE_PAD[0], rh0 = SCENE_R[3] - SCENE_R[1] + 2 * SCENE_PAD[1];
  const kmax = areaH / rh0;
  const need = rw0 * kmax + 12;
  const rw = clamp(VW - 2 * M - 14 - need, 450, 720), sw = VW - 2 * M - 14 - rw;
  const k = Math.min(kmax, (sw - 12) / rw0);
  const scW = rw0 * k, scH = rh0 * k;
  return { VW, sx: M, sy: mainY, sw, sh: mainH, headH, k, ox: M + (sw - scW) / 2, oy: mainY + headH + (areaH - scH) / 2 + 2, scW, scH, rx: M + sw + 14, rw, railY: 108, railH: 52, mainY, mainH, factsY: 870 };
}

function drawBanner(c, mode, L) {
  const M2 = c[mode], ok = mode === 'tobe', col = modeColor(mode);
  const label = c.group === 'Flagship' ? `FLAGSHIP ${c.n} OF 3` : `USE CASE ${c.n} OF 10`;
  const w = D.pill(`${label} | ${c.N.pillars.toUpperCase()}`, M, 19, COL.hosp, { size: 10.5, textColor: THEME === 'dark' ? '#04101f' : '#fff' });
  D.text(c.name, M + w + 14, 19.5, { size: 19, weight: 800, maxW: 560 });
  const nw = Math.min(560, D.measure(c.name, 19, 800));
  fitText(c.setting, M + w + 26 + nw, 20, L.VW - 2 * M - w - 26 - nw, 13.5, { weight: 500, color: T.sub });
  D.box(M, 38, L.VW - 2 * M, 52, { fill: tint(col, 0.07), stroke: tint(col, 0.45), lw: 1.4, r: 10 });
  D.box(M, 38, 6, 52, { fill: col, r: 3 });
  let sz = 15.5; while (sz > 12.5 && D.lines(M2.banner, L.VW - 2 * M - 40, sz, 600) > 2) sz -= 0.5;
  D.wrap(M2.banner, M + 20, 56, L.VW - 2 * M - 40, sz + 5, { size: sz, weight: 600, color: T.ink, maxLines: 2 });
  HOT('band', M, 38, L.VW - 2 * M, 52, { owner: ok ? 'cisco' : 'pain', tag: ok ? 'H' : 'S', title: ok ? `${c.short}: the modeled outcome` : `${c.short}: the situation today`, body: (ok ? c.vision : c.N.subtitle) + `<br><i>Roles in this scene: ${c.personas.join(', ')}.</i>`, src: `${SRCNAME}, ${c.id}` });
}

/* The workflow rail: every step of the story, Today first, then With Cloud Control. The active step fills in. */
function drawRail(c, mode, S, app, L) {
  const steps = allSteps(c), n = steps.length, nL = steps.filter((q) => q.mode === 'legacy').length;
  const gap = 8, pg = 30, total = L.VW - 2 * M, cw = (total - (n - 1) * gap - (pg - gap)) / n, y = L.railY, h = L.railH;
  const cur = (mode === 'tobe' ? nL : 0) + S.i;
  const xs = []; let x = M;
  steps.forEach((q, g) => { if (g === nL) x += pg - gap; xs.push(x); x += cw + gap; });
  // phase labels
  [['legacy', 0, nL - 1, MODENAME.legacy, COL.pain], ['tobe', nL, n - 1, MODENAME.tobe, COL.cisco]].forEach(([, a, b, name, col]) => {
    if (b < a) return; const x0 = xs[a], x1 = xs[b] + cw;
    D.text(name, x0 + 2, y - 9, { size: 10.5, weight: 800, color: col });
    D.line([[x0, y - 3], [x1, y - 3]], { lw: 2, color: tint(col, 0.5) });
  });
  steps.forEach((q, g) => {
    const x0 = xs[g], act = g === cur, done = g < cur, pc = q.mode === 'legacy' ? COL.pain : COL.cisco;
    D.box(x0, y, cw, h, { fill: act ? pc : done ? tint(pc, 0.1) : T.panel, stroke: act ? pc : done ? tint(pc, 0.55) : T.line2, lw: act ? 2 : 1.4, r: 11, shadow: act ? 10 : 0 });
    const ccx = x0 + 22, ccy = y + h / 2;
    if (done) { D.circle(ccx, ccy, 11, { fill: pc }); D.icon(q.mode === 'legacy' ? 'cross' : 'check', ccx, ccy, 10, '#fff'); }
    else D.circle(ccx, ccy, 11, { fill: act ? 'rgba(255,255,255,.25)' : T.panel, stroke: act ? '#fff' : T.faint, lw: 1.6 });
    if (!done) D.text(String(g + 1), ccx, ccy + 0.5, { size: 12, weight: 800, color: act ? '#fff' : T.faint, align: 'center' });
    const tc = act ? '#fff' : done ? T.ink : T.sub;
    let fs = 14; while (fs > 10 && D.lines(q.s.title, cw - 52, fs, 800) > 2) fs -= 0.5;
    D.wrap(q.s.title, x0 + 40, y + h / 2 - (D.lines(q.s.title, cw - 52, fs, 800) > 1 ? 8.5 : 0), cw - 52, fs + 3, { size: fs, weight: act ? 800 : 700, color: tc, maxLines: 2 });
    if (act) { D.box(x0 + 10, y + h - 7, cw - 20, 3.5, { fill: 'rgba(255,255,255,.28)', r: 2 }); D.box(x0 + 10, y + h - 7, (cw - 20) * S.su, 3.5, { fill: '#fff', r: 2 }); }
    if (g < n - 1 && g !== nL - 1) D.line([[x0 + cw + 2, ccy - 5], [x0 + cw + 6, ccy], [x0 + cw + 2, ccy + 5]], { lw: 1.6, color: T.faint });
    app.stepBoxes.push({ i: g, x: x0, y, w: cw, h });
    HOT('rail' + g, x0, y, cw, h, { owner: q.mode === 'legacy' ? 'pain' : 'cisco', tag: 'I', title: `Step ${g + 1}: ${q.s.title}`, body: `<b>Executive:</b> ${q.s.say.exec}<br><b>IT director:</b> ${q.s.say.dir}<br><b>Engineering:</b> ${q.s.say.eng}<br><i>Click to replay from this step.</i>`, src: `${SRCNAME}, ${c.id}` });
  });
}

function panel(x, y, w, h, col, o = {}) {
  D.box(x, y, w, h, { fill: o.fill || T.panel, stroke: o.stroke || T.line2, lw: o.lw || 1.4, r: 12, shadow: o.shadow ?? 4 });

}

function drawScenePanel(c, mode, u, t, app, L) {
  const ec = modeColor(mode);
  panel(L.sx, L.sy, L.sw, L.sh, null, { shadow: 6 });
  D.box(L.sx, L.sy, L.sw, L.headH, { fill: tint(ec, 0.09), r: 12 }); D.box(L.sx, L.sy + L.headH - 12, L.sw, 12, { fill: tint(ec, 0.09), r: 0 });
  const pw = D.pill(mode === 'tobe' ? 'WITH CLOUD CONTROL' : 'TODAY', L.sx + 16, L.sy + 19, ec, { size: 11 });
  const st = phaseSteps(c, mode), i = Math.min(st.length - 1, Math.floor(u * st.length));
  const right = `Step ${i + 1} of ${st.length} | ${st[i].title}`, rw = Math.min(520, D.measure(right, 14, 700));
  fitText(c[mode].strip, L.sx + 28 + pw, L.sy + 19.5, L.sw - 56 - pw - rw - 12, 13.5, { weight: 600, color: T.ink });
  D.text(right, L.sx + L.sw - 16, L.sy + 19.5, { size: 14, weight: 700, color: ec, align: 'right', maxW: 520 });
  HOT('scene', L.sx, L.sy, L.sw, L.sh, { owner: mode === 'tobe' ? 'cisco' : 'pain', tag: 'I', title: c.setting, body: mode === 'tobe' ? c.vision : c.N.subtitle, src: `${SRCNAME}, ${c.id}` });
  ctx.save(); D.rr(L.ox, L.oy, L.scW, L.scH, 10); ctx.clip();
  ctx.translate(L.ox - (SCENE_R[0] - SCENE_PAD[0]) * L.k, L.oy - (SCENE_R[1] - SCENE_PAD[1]) * L.k); ctx.scale(L.k, L.k);
  const S = drawUCScene(c, mode, u, t, app);
  ctx.restore();
  if (app.fade > 0.01) { ctx.save(); ctx.globalAlpha = app.fade * 0.94; D.box(L.ox - 2, L.oy - 2, L.scW + 4, L.scH + 4, { fill: T.bg, r: 10 }); ctx.restore(); }
  return S;
}

function drawRight(c, mode, u, t, app, S, L) {
  const ec = modeColor(mode), M2 = c[mode], ok = mode === 'tobe', x = L.rx, w = L.rw, aud = app.aud;

  { const y = ys[0], h = hs[0], say = S.step.say[aud];
    panel(x, y, w, h, ec, { fill: T.panel2, stroke: tint(ec, 0.55), lw: 1.7, shadow: 8 });

    D.wrap(say, x + 20, y + 74, w - 40, 21, { size: 15.5, weight: 500, color: T.ink, maxLines: 5 });
    HOT('now', x, y, w, h, { owner: ok ? 'cisco' : 'pain', tag: 'I', title: S.step.title, body: `<b>Executive:</b> ${S.step.say.exec}<br><b>IT director:</b> ${S.step.say.dir}<br><b>Engineering:</b> ${S.step.say.eng}<br><i>Switch audience in the footer (keys 1, 2, 3).</i>`, src: `${SRCNAME}, ${c.id}` }); }

  // 2. What is missing (today) or the console (with Cloud Control)
  { const y = ys[1], h = hs[1], L2 = c.legacy;
    panel(x, y, w, h, ec);
    if (!ok) {
      D.text('WHAT IS MISSING TODAY', x + 20, y + 20, { size: 11.5, weight: 800, color: COL.pain }); D.tag(x + w - 18, y + 20, 'H');
      L2.gaps.forEach((b, i) => { D.icon('cross', x + 28, y + 43 + i * 23, 11, COL.pain); fitText(b, x + 44, y + 43.5 + i * 23, w - 62, 13.5, { weight: 500, color: T.ink }); });
      D.text(L2.big[0], x + 20, y + h - 22, { size: 24, weight: 800, color: COL.pain, maxW: 150 });
      const bw = Math.min(150, D.measure(L2.big[0], 24, 800));
      D.wrap(L2.big[1], x + 30 + bw, y + h - 28, w - 48 - bw, 13.5, { size: 11.5, color: T.sub, maxLines: 2 });
      HOT('mode', x, y, w, h, { owner: 'pain', tag: 'H', title: 'Gaps and pain points today', body: L2.gaps.join('<br>') + `<br><i>Discovery question: ${L2.ask || c.ask}</i>`, src: `${SRCNAME}, ${c.id}` });
    } else {
      const cs = M2.console;
      D.text(cs.title.toUpperCase(), x + 20, y + 20, { size: 11.5, weight: 800, color: COL.cisco, maxW: w - 150 }); D.pill('SIMULATED', x + w - 16, y + 20, COL.partner, { size: 9, align: 'right' });
      cs.rows.forEach((r, i) => {
        const ry = y + 36 + i * 25, done = S.i >= r[3] && (S.i > r[3] || S.su > 0.35);
        D.box(x + 14, ry, w - 28, 22, { fill: done ? tint(COL.run, 0.1) : tint(COL.data, 0.1), stroke: T.line2, lw: 1, r: 6 });
        D.icon(r[4] || 'check', x + 28, ry + 11, 12, done ? COL.run : COL.amber);
        D.text(r[0], x + 44, ry + 11.5, { size: 12.5, weight: 700, maxW: 200 });
        D.text(done ? r[2] : r[1], x + w - 24, ry + 11.5, { size: 12.5, weight: 700, color: done ? COL.run : COL.amber, align: 'right', maxW: w - 270 });
      });

      HOT('mode', x, y, w, h, { owner: 'cisco', tag: 'I', title: cs.title, body: cs.body + ' Values on this screen are simulated for illustration.', src: `${SRCNAME}, ${c.id}` });
    } }

  // 3. The data path, four hops
  { const y = ys[2], h = hs[2];
    panel(x, y, w, h, ec);
    D.text(ok ? 'WITH CLOUD CONTROL: ONE DATA PATH' : 'TODAY: SEPARATE SYSTEMS', x + 20, y + 15, { size: 10.5, weight: 800, color: T.sub, maxW: w * 0.55 });
    fitText(M2.pathNote, x + w - 14, y + 15, w - 240, 10.5, { weight: 700, color: ec, align: 'right' });
    const cw = (w - 28) / 4;
    M2.hops.forEach((hp, i) => {

      D.circle(cx, cy, 14, { fill: ok ? tint(COL.cisco, 0.1) : T.panel2, stroke: ok ? COL.cisco : COL.idle, lw: 1.8 });
      D.icon(hp[2] || 'server', cx, cy, 15, ok ? COL.cisco : COL.idle);
      D.wrap(hp[0], cx, y + 62, cw - 8, 12, { size: 11, weight: 700, align: 'center', maxLines: 2 });
      if (i < 3) {
        const p2 = Path([[cx + 17, cy], [cx + cw - 17, cy]]);
        if (ok) D.flow(p2, t + i * 0.3, { n: 1, speed: 40, r: 3, color: COL.cisco, lw: 1.8 });
        else { D.line(p2.pts, { lw: 2, color: tint(COL.pain, 0.5), dash: [3, 3] }); D.icon('cross', cx + cw / 2, cy, 9, COL.pain); }
      }
    });
    HOT('path', x, y, w, h, { owner: ok ? 'cisco' : 'pain', tag: ok ? 'S' : 'H', title: ok ? 'Data path with Cloud Control' : 'Separate path today', body: (ok ? c.chips.map((q) => `${q[0]}: ${q[1]}`).join('<br>') : 'Each hop is a separate system with its own console and team; signals do not flow from one to the next. Current tools are not public [H].') + '<br>' + M2.hops.map((hp) => `<b>${hp[0]}</b>: ${hp[1]}`).join('<br>'), src: `${SRCNAME}, ${c.id}` }); }

  // 4. Outcomes
  { const y = ys[3], h = hs[3];
    panel(x, y, w, h, ec);
    D.text(ok ? 'OUTCOMES (MODELED, NOT FORECAST)' : 'IMPACT TODAY', x + 20, y + 16, { size: 10.5, weight: 800, color: T.sub });
    M2.outcomes.forEach((o, i) => {
      const ry = y + 28 + i * 37;
      let vs = 21; while (vs > 13 && D.measure(o[0], vs, 800) > 118) vs -= 1;
      D.text(o[0], x + 20, ry + 17, { size: vs, weight: 800, color: ec, maxW: 122 });
      D.wrap(o[1], x + 150, ry + 10, w - 150 - 40, 13.5, { size: 12, color: T.sub, maxLines: 2 });
      D.tag(x + w - 20, ry + 17, o[2]);
      if (i < 2) D.line([[x + 20, ry + 35], [x + w - 20, ry + 35]], { lw: 0.8, color: T.line2 });
    });
    HOT('outs', x, y, w, h, { owner: ok ? 'cisco' : 'pain', tag: 'S', title: ok ? 'Outcomes and KPIs' : 'Where the hospital starts', body: ok ? 'Figures tagged S are public. Items tagged H are hypotheses to measure in a pilot. No savings, percentages or targets are forecast; no Cisco healthcare customer metric for Cloud Control exists yet.<br><b>KPIs to baseline in a pilot (no targets claimed):</b><br>' + c.kpis.join('<br>') : c.N.subtitle, src: `${SRCNAME}, ${c.id}` }); }

  // 5. Discovery question (today) or the boundary (with Cloud Control)
  { const y = ys[4], h = hs[4];
    panel(x, y, w, h, ec, { fill: T.panel2 });
    D.text(ok ? 'STAYS WITH THE HOSPITAL AND ITS VENDORS' : 'DISCOVERY QUESTION', x + 20, y + 15, { size: 10.5, weight: 800, color: T.sub });
    if (ok) D.wrap(M2.stays, x + 20, y + 33, w - 38, 14, { size: 11.5, color: T.ink, maxLines: 3 });
    else D.wrap(c.ask, x + 20, y + 36, w - 38, 18, { size: 14, weight: 600, color: T.ink, maxLines: 2 });
    HOT('ask', x, y, w, h, { owner: ok ? 'partner' : 'pain', tag: 'H', title: ok ? 'Stays in place' : 'Discovery question', body: ok ? M2.stays : c.ask, src: `${SRCNAME}, ${c.id}` }); }
}

function drawFacts(c, mode, L) {
  let facts = factsOf(c, mode), fs = 13;
  const avail = L.VW - 2 * M, total = (list, f) => list.reduce((a, q) => a + D.measure(q[0], f) + 40 * f / 12, 0);
  while (facts.length > 1 && total(facts, 11) > avail) facts = facts.slice(0, -1);
  while (fs > 11 && total(facts, fs) > avail) fs -= 0.25;
  let fx = M;
  facts.forEach(([f, tg]) => { D.tag(fx + 7, L.factsY, tg); D.text(f, fx + 20, L.factsY + 0.5, { size: fs, color: T.ink }); fx += D.measure(f, fs) + 40 * fs / 12; });
  if (fx > L.VW - 4) OVERFLOW.push('facts ' + c.id);
  D.text('Layout, IDs, timings and counts are simulated. Outcomes are modeled; no percentage is claimed for Cloud Control.', M, L.factsY + 20, { size: 10.5, italic: true, color: T.faint, maxW: avail });
}

function drawPage(c, mode, u, t, app) {
  const L = layout(app); SUF = '_' + mode;
  drawBanner(c, mode, L);
  const S = drawScenePanel(c, mode, u, t, app, L);
  drawRail(c, mode, S, app, L);
  drawRight(c, mode, u, t, app, S, L);
  drawFacts(c, mode, L);
  SUF = '';
  return S;
}

function tourFor(c) {
  const L = c.N.steps.filter((s) => s.phase === 'today'), W = c.N.steps.filter((s) => s.phase === 'cisco');
  const pick = (list, k) => list[Math.min(list.length - 1, k)];
  return [
    { dur: 7, mode: 'legacy', focus: 'scene', title: `${c.short} | Today`, cap: () => c.N.subtitle },
    { dur: 6, mode: 'legacy', focus: 'legacyband', title: `${c.short} | Separate tools`, cap: () => c.legacy.tour[0] },
    { dur: 6, mode: 'legacy', focus: 'mode', title: `${c.short} | Gaps`, cap: (a) => pick(L, L.length - 1).say[a] },
    { dur: 8, mode: 'tobe', focus: 'scene', title: `${c.short} | With Cloud Control`, cap: (a) => pick(W, 0).say[a] },
    { dur: 7, mode: 'tobe', focus: 'path', title: `${c.short} | One data path`, cap: () => c.tobe.tour[0] },
    { dur: 7, mode: 'tobe', focus: 'outs', title: `${c.short} | Outcomes and KPIs`, cap: () => c.tobe.tour[1] },
  ];
}

/* Event feed: every step reached so far, Today first, then With Cloud Control. */
function feedFor(c, app) {
  const p = app.cur, out = [];
  const add = (mode, upto) => phaseSteps(c, mode).forEach((s, i) => { if (i <= upto) out.push({ k: `${mode}-${i}-${app.aud}`, ts: `Step ${i + 1}`, src: mode === 'tobe' ? 'Cloud Control' : 'Today', msg: s.title, color: mode === 'tobe' ? COL.cisco : COL.pain }); });
  add('legacy', p.mode === 'tobe' ? 99 : p.i); if (p.mode === 'tobe') add('tobe', p.i);
  return out;
}

/* ---- 30-app.js ---- */
/* App shell: tabs, story flow, audience, retractable side panel, tooltips, guided tour, deterministic stepping.
   The scenario clock runs in "steps" of SD seconds. Flow 'story' plays Today then With Cloud Control as one continuous story;
   'legacy' and 'tobe' loop one phase only. */
function createApp(cfg) {
  const H = 900;
  const params = new URLSearchParams(location.search);
  const N = cfg.cases.length;
  const saved = (k) => { try { return localStorage.getItem('hcs.' + k); } catch { return null; } };
  const keep = (k, v) => { try { localStorage.setItem('hcs.' + k, v); } catch { /* ignore */ } };
  const flowParam = params.get('flow') || params.get('mode');
  const app = {
    t: +(params.get('t') || 0), dt: 0, speed: 1, playing: !params.has('paused'), tourOn: false, tourT0: 0, hots: [], stepBoxes: [], focus: null,
    uc: clamp((+(params.get('uc') || 1) - 1) | 0, 0, N - 1), flow: ['story', 'legacy', 'tobe'].includes(flowParam) ? flowParam : 'story', mode: 'legacy', t0: 0, W: 1600, H, cfg,
    cur: { mode: 'legacy', i: 0, u: 0, g: 0 }, fade: 0, base: 1,

  };
  window.APP = app;
  setTheme(params.get('theme') || saved('theme') || 'light');

  const root = document.createElement('div'); root.id = 'app';
  const tagSpan = (k) => `<span class="tag ${k}">${k === 'I' ? 'i' : k}</span>`;
  const ownerRows = Object.entries(OWNER).map(([k, [n]]) => `<div class="r"><span class="sw${k === 'data' ? ' dot' : ''}" data-own="${k}"></span>${n}</div>`).join('');
  const stateRows = [['ok', 'Healthy'], ['warn', 'Warning'], ['down', 'Down, shown with a red cross'], ['pending', 'Waiting for a person to approve'], ['unknown', 'Unknown or not instrumented']]
    .map(([k, n]) => `<div class="r"><span class="sw dot" data-st="${k}"></span>${n}</div>`).join('');
  const sec = (k, title, body) => `<details data-k="${k}"><summary id="sum_${k}">${title}</summary>${body}</details>`;
  root.innerHTML = `
  <header><div class="brand"><div class="mark"></div><div style="min-width:0"><h1>${cfg.title}</h1></div></div>
  <div class="hdr-right">${cfg.subtitle}</div></header>
  <nav id="tabs">${cfg.cases.map((c, i) => `<button data-i="${i}" title="${c.name}"><span class="k">${c.code} | ${c.group === 'Flagship' ? 'Flagship' : 'Use case'}</span><span class="n">${c.short}</span></button>`).join('')}</nav>
  <main><div id="stage"><canvas id="cv"></canvas><div id="tip"></div><div id="caption"><div class="st"></div><div class="cx"></div><div class="bar"><i></i></div></div></div>
  <button id="sideTab" title="Show or hide key figures and legend (P)"><span id="sideTabTxt"></span></button>
  <aside id="side">

    ${sec('feed', 'Event feed (simulated)', '<div class="feed" id="feed"></div>')}
    ${sec('who', 'Roles and the question', '<div id="who" class="who"></div>')}
    ${sec('legend', 'Legend', `<div class="legend">${ownerRows}${stateRows}
      <div class="r">${tagSpan('S')}<span><b>Sourced</b>: public source in the research briefs</span></div>
      <div class="r">${tagSpan('H')}<span><b>Hypothesis</b>: to validate with the customer</span></div>
      <div class="r">${tagSpan('I')}<span><b>Illustrative</b>: simulated layout, IDs and timings</span></div></div>`)}
    <div class="srcnote" id="srcnote"></div>
  </aside></main>
  <footer>
    <button id="bPlay" class="on">Pause</button>
    <button id="bRestart">Restart</button>
    <div class="grp" id="gSpeed">${[0.5, 1, 2].map((s) => `<button data-s="${s}" class="${s === 1 ? 'on' : ''}">${s}x</button>`).join('')}</div>
    <button id="bTour">Guided tour</button>
    <span class="lbl">Flow</span><div class="grp" data-tg="mode"><button data-v="story" title="Today, then With Cloud Control, as one story (M)">Story</button><button data-v="legacy">Today</button><button data-v="tobe">With Cloud Control</button></div>
    <span class="lbl">Audience</span><div class="grp" data-tg="aud"><button data-v="exec">Executive</button><button data-v="dir">IT director</button><button data-v="eng">Engineering</button></div>
    <div class="grp"><button id="bPrev" title="Previous (left arrow)">Prev</button><button id="bNext" title="Next (right arrow)">Next</button></div>
    <button id="bPanels" title="Key figures, feed and legend (P)">Panels</button>
    <button id="bTheme" title="Light or dark (D)">Dark</button>
    <span class="sp"></span><span class="clock" id="clock"></span>
  </footer>`;
  document.body.appendChild(root);

  const cv = document.getElementById('cv'), stage = document.getElementById('stage'), tip = document.getElementById('tip'), cap = document.getElementById('caption');
  ctx = cv.getContext('2d');
  let scale = 1, dpr = 1;
  function resize() {
    const r = stage.getBoundingClientRect(); if (r.width < 10 || r.height < 10) return;
    const avH = Math.max(100, r.height - 2);
    app.W = Math.round(clamp((H * r.width) / avH, 1500, 1900));
    scale = Math.max(0.1, Math.min(r.width / app.W, avH / H));
    dpr = window.devicePixelRatio || 1; app.base = scale * dpr;
    cv.style.width = app.W * scale + 'px'; cv.style.height = H * scale + 'px';
    cv.width = Math.round(app.W * scale * dpr); cv.height = Math.round(H * scale * dpr);
    render();
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(stage);

  const paintLegend = () => document.querySelectorAll('.sw[data-own]').forEach((e) => { e.style.background = ownerColor(e.dataset.own); });
  const paintStates = () => document.querySelectorAll('.sw[data-st]').forEach((e) => { e.style.background = sc(e.dataset.st); });
  function applyTheme(name) {
    setTheme(name); keep('theme', name); paintLegend(); paintStates();
    const b = document.getElementById('bTheme'); if (b) b.textContent = THEME === 'dark' ? 'Light' : 'Dark';
    ANIM.key = ''; render();
  }
  app.setTheme = applyTheme;

  /* Retractable side panel and its sections */
  const setSide = (open, persist = true) => {
    root.classList.toggle('side-open', open); app.sideOpen = open; if (persist) keep('side', open ? 1 : 0);
    document.getElementById('sideTabTxt').textContent = open ? 'Hide panels  \u25B8' : '\u25C2  Key figures and legend';
    document.getElementById('bPanels').classList.toggle('on', open);
  };
  const sv = saved('side'); setSide(params.has('panel') ? params.get('panel') === '1' : sv === null ? window.innerWidth >= 1800 : sv === '1', false);
  document.getElementById('sideTab').onclick = () => setSide(!app.sideOpen);
  document.getElementById('bPanels').onclick = () => setSide(!app.sideOpen);
  document.querySelectorAll('#side details').forEach((d) => {
    const v = saved('d_' + d.dataset.k); d.open = v === null ? d.dataset.k !== 'legend' : v === '1';
    d.addEventListener('toggle', () => keep('d_' + d.dataset.k, d.open ? 1 : 0));
  });

  const bPlay = document.getElementById('bPlay');
  const setPlaying = (p) => { app.playing = p; bPlay.textContent = p ? 'Pause' : 'Play'; bPlay.classList.toggle('on', p); };
  bPlay.onclick = () => setPlaying(!app.playing);
  document.getElementById('bRestart').onclick = () => { app.t0 = app.t; app.tourT0 = app.t; feedKey = ''; render(); };
  document.querySelectorAll('#gSpeed button').forEach((b) => (b.onclick = () => { app.speed = +b.dataset.s; document.querySelectorAll('#gSpeed button').forEach((x) => x.classList.toggle('on', x === b)); }));
  const bTour = document.getElementById('bTour');
  let flowBefore = null;
  function setTour(v) {
    if (v && !app.tourOn) flowBefore = app.flow;
    app.tourOn = v; app.tourT0 = app.t; bTour.classList.toggle('on', v); bTour.textContent = v ? 'Stop tour' : 'Guided tour';
    if (!v) { cap.classList.remove('show'); if (flowBefore && flowBefore !== app.flow) setFlow(flowBefore); flowBefore = null; }
  }
  bTour.onclick = () => setTour(!app.tourOn);
  document.getElementById('bTheme').onclick = () => applyTheme(THEME === 'dark' ? 'light' : 'dark');

  const kpiEl = document.getElementById('kpis'), srcEl = document.getElementById('srcnote'), whoEl = document.getElementById('who');
  let kEls = [];
  function buildSide() {
    const c = cfg.cases[app.uc];
    document.getElementById('sum_kpi').textContent = `Key figures | ${c.code}`;
    kpiEl.innerHTML = c.tiles.map((k, i) => `<div class="kpi" id="kb_${i}" style="--c:${k.color || 'var(--sub)'}"><div class="v" id="k_${i}"></div><div class="l">${k.l}</div><span class="tg">${tagSpan(k.tag || 'I')}</span></div>`).join('');
    kEls = c.tiles.map((k, i) => [document.getElementById('k_' + i), document.getElementById('kb_' + i)]);
    whoEl.innerHTML = `<div class="pl">${c.personas.map((p) => `<span>${p}</span>`).join('')}</div><p><b>Discovery question.</b> ${c.ask}</p><p><b>KPIs to baseline (no targets claimed).</b> ${c.kpis.join('; ')}.</p>`;
    srcEl.innerHTML = `<b>Source of truth:</b> ${SRCNAME} (${c.code}, ${c.name}); research briefs 01 to 05 and sources.md. <b>Availability and caveats:</b> ${c.N.caveat} <b>Boundary:</b> ${c.tobe.stays} Layouts, IDs, timings and animated counts are simulated.`;
  }
  const hash = () => history.replaceState(null, '', `${location.pathname}${location.search.replace(/[?&]t=[^&]*/, '')}#${cfg.cases[app.uc].id}/${app.flow}`);

  /* The scenario clock. Steps of SD seconds; 'story' = Today steps then Cloud Control steps. */
  const counts = () => { const c = cfg.cases[app.uc]; return [phaseSteps(c, 'legacy').length, phaseSteps(c, 'tobe').length]; };
  const spanSteps = (flow = app.flow) => { const [a, b] = counts(); return flow === 'story' ? a + b : flow === 'legacy' ? a : b; };
  app.span = () => spanSteps() * SD;
  function timeline() {
    const [nL, nT] = counts(), total = spanSteps(), g = mod((app.t - app.t0) / SD, total);
    let mode, local, n;
    if (app.flow === 'legacy') { mode = 'legacy'; local = g; n = nL; }
    else if (app.flow === 'tobe') { mode = 'tobe'; local = g; n = nT; }
    else if (g < nL) { mode = 'legacy'; local = g; n = nL; } else { mode = 'tobe'; local = g - nL; n = nT; }
    // a short fade at every story seam hides the switch between phases
    let fade = 0;
    if (app.flow === 'story') { const d = Math.min(Math.abs(g - nL), Math.min(g, total - g)); fade = clamp(1 - d / 0.11, 0, 1); }
    return { mode, u: local / n, i: Math.min(n - 1, Math.floor(local)), g, fade };
  }
  app.u = () => timeline().u;

  function setUC(i) {
    app.uc = mod(i, N); app.t0 = app.t; feedKey = '';
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', +b.dataset.i === app.uc));
    const on = document.querySelector('#tabs button.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    buildSide(); hash();
  }
  function setFlow(f) {
    if (app.flow !== f) { app.flow = f; app.t0 = app.t; feedKey = ''; }
    document.querySelectorAll('[data-tg="mode"] button').forEach((x) => x.classList.toggle('on', x.dataset.v === app.flow)); hash();
  }
  function setAud(a) {
    app.aud = a; keep('aud', a); feedKey = '';
    document.querySelectorAll('[data-tg="aud"] button').forEach((x) => x.classList.toggle('on', x.dataset.v === a));
  }
  app.setUC = setUC; app.setMode = setFlow; app.setFlow = setFlow; app.setAud = setAud;
  document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => { if (app.tourOn) setTour(false); setUC(+b.dataset.i); }));
  document.querySelectorAll('[data-tg="mode"] button').forEach((b) => (b.onclick = () => { if (app.tourOn) setTour(false); setFlow(b.dataset.v); }));
  document.querySelectorAll('[data-tg="aud"] button').forEach((b) => (b.onclick = () => setAud(b.dataset.v)));
  document.getElementById('bPrev').onclick = () => setUC(app.uc - 1);
  document.getElementById('bNext').onclick = () => setUC(app.uc + 1);
  const FLOWS = ['story', 'legacy', 'tobe'];
  window.addEventListener('keydown', (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.code === 'Space') { setPlaying(!app.playing); e.preventDefault(); }
    if (e.key === 'ArrowRight') setUC(app.uc + 1);
    if (e.key === 'ArrowLeft') setUC(app.uc - 1);
    if (e.key === 'm' || e.key === 't') setFlow(FLOWS[(FLOWS.indexOf(app.flow) + 1) % 3]);
    if (e.key === '1') setAud('exec'); if (e.key === '2') setAud('dir'); if (e.key === '3') setAud('eng');
    if (e.key === 'd') applyTheme(THEME === 'dark' ? 'light' : 'dark');
    if (e.key === 'p') setSide(!app.sideOpen);
  });

  let mouse = null;
  stage.addEventListener('mousemove', (e) => { const r = cv.getBoundingClientRect(); mouse = { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale, cx: e.clientX, cy: e.clientY }; });
  stage.addEventListener('mouseleave', () => { mouse = null; });
  stage.addEventListener('click', (e) => {
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / scale, y = (e.clientY - r.top) / scale;
    const hit = app.stepBoxes.find((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
    if (hit) {
      const [nL] = counts(), isT = hit.i >= nL;
      if (app.tourOn) setTour(false);
      if ((isT && app.flow === 'legacy') || (!isT && app.flow === 'tobe')) setFlow('story');
      const local = app.flow === 'tobe' ? hit.i - nL : hit.i;
      app.t0 = app.t - (local + 0.02) * SD; feedKey = ''; render();
    }
  });

  app.hot = (id, x, y, w, h, info) => { app.hots.push({ id, x, y, w, h, info }); };
  app.find = (id) => { for (let i = app.hots.length - 1; i >= 0; i--) if (app.hots[i].id === id) return app.hots[i]; return null; };

  function tipHTML(info) {
    const o = OWNER[info.owner] || OWNER.hosp, k = info.tag || 'I';
    const st = info.state && STATE_NAME[info.state] ? `<span class="chip" style="background:${sc(info.state)};color:${info.state === 'warn' ? '#1d2327' : '#fff'}">${STATE_NAME[info.state]}</span>` : '';
    return `<div class="tt">${tagSpan(k)}${info.title}</div><div class="chips"><span class="chip" style="background:${o[1]()}">${o[0]}</span>${st}<span class="chip" style="background:${k === 'S' ? 'var(--ink)' : k === 'H' ? COL.cisco : '#8a959c'}">${TAGTXT[k]}</span></div><div>${info.body || ''}</div>${info.src ? `<div class="src">Source: ${info.src}</div>` : ''}`;
  }
  let tipFor = null;
  function showTip(h, px, py) {
    const html = tipHTML(h.info), key = h.id + app.aud + THEME;
    if (tipFor !== key) { tip.innerHTML = html; tipFor = key; }
    const sr = stage.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = px + 16, y = py + 16;
    if (x + tw > sr.width - 8) x = px - tw - 16;
    if (y + th > sr.height - 8) y = sr.height - th - 8;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px'; tip.classList.add('show');
  }
  const hideTip = () => { tip.classList.remove('show'); tipFor = null; };

  let feedKey = '';
  const feedEl = document.getElementById('feed'), clockEl = document.getElementById('clock');
  const tourSteps = () => cfg.tour(cfg.cases[app.uc]);
  function tourStep() {
    if (!app.tourOn) return null;
    const tour = tourSteps(), len = tour.reduce((a, s) => a + s.dur, 0);
    let tt = mod(app.t - app.tourT0, len), i = 0;
    while (tt >= tour[i].dur) { tt -= tour[i].dur; i++; }
    return { i, n: tour.length, s: tour[i], u: tt / tour[i].dur };
  }

  function render() {
    const ts = tourStep();
    if (ts && ts.s.mode && ts.s.mode !== app.flow) setFlow(ts.s.mode);
    const tl = timeline(); app.mode = tl.mode; app.cur = tl; app.fade = tl.fade;
    app.focus = ts ? ts.s.focus + '_' + app.mode : null;
    OVERFLOW.length = 0; app.hots = []; app.stepBoxes = [];
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.clearRect(0, 0, app.W, H);
    ctx.fillStyle = T.bg; ctx.fillRect(0, 0, app.W, H);
    const c = cfg.cases[app.uc];
    cfg.draw(c, app.mode, tl.u, app.t, app);
    window.__overflow = OVERFLOW.slice();
    if (app.focus) {
      const h = app.find(app.focus);
      if (h) {
        const p = 0.5 + 0.5 * Math.sin(app.t * 5);
        D.box(h.x - 6, h.y - 6, h.w + 12, h.h + 12, { stroke: COL.data, lw: 3, r: 10, dash: [8, 5] });
        D.box(h.x - 10 - p * 3, h.y - 10 - p * 3, h.w + 20 + p * 6, h.h + 20 + p * 6, { stroke: tint(COL.data, 0.35), lw: 2, r: 13 });
        const cr = cv.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        const right = (h.x + h.w) * scale + (cr.left - sr.left);
        const px = right + 360 < sr.width ? right + 4 : h.x * scale + (cr.left - sr.left) - 380;
        showTip(h, px, Math.max(70, (h.y + h.h * 0.3) * scale + (cr.top - sr.top) - 60));
      } else hideTip();
    } else if (mouse) {
      let hit = null;
      for (let i = app.hots.length - 1; i >= 0; i--) { const h = app.hots[i]; if (mouse.x >= h.x && mouse.x <= h.x + h.w && mouse.y >= h.y && mouse.y <= h.y + h.h) { hit = h; break; } }
      const onStep = app.stepBoxes.some((b) => mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h);
      if (hit) { const sr = stage.getBoundingClientRect(); showTip(hit, mouse.cx - sr.left, mouse.cy - sr.top); stage.style.cursor = onStep ? 'pointer' : 'help'; }
      else { hideTip(); stage.style.cursor = 'default'; }
    } else hideTip();
    if (ts) {
      cap.querySelector('.st').textContent = `Step ${ts.i + 1} of ${ts.n} | ${ts.s.title}`;
      cap.querySelector('.cx').textContent = ts.s.cap(app.aud);
      cap.querySelector('.bar i').style.width = (ts.u * 100).toFixed(1) + '%';
      cap.classList.add('show');
    }
    c.tiles.forEach((k, i) => {
      const v = app.mode === 'tobe' ? k.b : k.a;
      if (kEls[i] && kEls[i][0].textContent !== v) { kEls[i][0].textContent = v; kEls[i][0].title = v; }
      if (kEls[i]) kEls[i][1].classList.toggle('hl', app.mode === 'tobe' && k.a !== k.b);
    });
    const items = cfg.feed(c, app).slice(-6);
    const key = app.uc + app.mode + app.aud + items.map((m) => m.k).join('|');
    if (key !== feedKey) {
      feedKey = key;
      feedEl.innerHTML = items.slice().reverse().map((m, i) => `<div class="m${i ? '' : ' new'}" style="--c:${m.color || COL.data}"><span class="ts">${m.ts}</span><b>${m.src}</b> ${m.msg}</div>`).join('');
    }
    clockEl.textContent = `${c.code} | ${AUDNAME[app.aud]} | ${app.flow === 'story' ? 'Story' : app.flow === 'legacy' ? 'Today only' : 'Cloud Control only'} | sim t = ${app.t.toFixed(1)} s`;
  }

  function step(dt) { app.dt = dt; app.t += dt; render(); }
  let last = performance.now();
  function frame(now) {
    const rdt = Math.min(0.1, (now - last) / 1000); last = now;
    if (app.playing) step(rdt * app.speed); else { app.dt = 0; render(); }
    requestAnimationFrame(frame);
  }
  window.__rec = { step(dt) { step(dt); return app.t; }, ready: true };
  const hs = location.hash.match(/^#([a-z0-9]+)(?:\/(story|legacy|tobe))?/);
  if (hs && !params.has('uc')) { const k = cfg.cases.findIndex((c) => c.id === hs[1]); if (k >= 0) app.uc = k; if (hs[2] && !flowParam) app.flow = hs[2]; }
  app.t0 = 0; app.t = +(params.get('t') || 0);
  setUC(app.uc); setFlow(app.flow); setAud(app.aud);
  if (params.has('u')) app.t0 = app.t - clamp(+params.get('u'), 0, 0.9999) * spanSteps() * SD;
  paintLegend(); paintStates(); document.getElementById('bTheme').textContent = THEME === 'dark' ? 'Light' : 'Dark';
  if (params.has('tour')) setTour(true);
  if (!app.playing) setPlaying(false);
  resize();
  requestAnimationFrame(frame);
  return app;
}

};

/* ---- 90-boot.js ---- */
/* Boot: attach the shared narrative to each use case, start the app, optional ?check overflow sweep. */
(function boot() {
  UCS.forEach((c) => {
    c.scene.decor = DECOR[c.id]; if (!c.scene.decor) throw new Error('No floor plan for ' + c.id);
    c.N = NARR.find((s) => s.id === c.id);
    if (!c.N) throw new Error('No narrative for ' + c.id);
    ['legacy', 'tobe'].forEach((m) => { c[m].hops = c.hops[m]; c[m].outcomes = c.outcomes[m]; c[m].pathNote = c.pathNote[m]; });
    const seen = new Map();
    c.N.steps.forEach((s) => (s.chips || []).forEach((q) => seen.set(q[0], q[1])));
    c.chips = Array.from(seen.entries());
    c.tiles.forEach((k) => { k.color = k.tag === 'H' ? 'var(--cisco)' : 'var(--sub)'; });
  });
  const app = createApp({
    title: 'Healthcare infrastructure: interactive 2D models',
    subtitle: 'Thirteen stories on hospital floor plans. Today versus with Cisco Cloud Control (modeled). Click a step, hover anything, or start the guided tour.',
    cases: UCS, tour: tourFor, feed: feedFor,
    draw(c, mode, u, t, a) { drawPage(c, mode, u, t, a); },
  });
  if (new URLSearchParams(location.search).has('check')) {
    const bad = [];
    for (let k = 0; k < UCS.length; k++) {
      for (const m of ['story']) {
        for (const aud of ['exec', 'dir', 'eng']) {
          app.setUC(k); app.setFlow(m); app.setAud(aud); app.tourOn = false; app.playing = false;
          for (let f = 0; f < 18; f++) {
            app.t0 = app.t - ((f + 0.5) / 18) * app.span(); window.__rec.step(0.02);
            (window.__overflow || []).forEach((o) => bad.push(`${UCS[k].id}/${m}/${aud}@${f}: ${o}`));
          }
        }
      }
    }
    window.__check = Array.from(new Set(bad));
    console.log('CHECK overflow count', window.__check.length); window.__check.slice(0, 80).forEach((b) => console.log('OVF', b));
  }
})();
